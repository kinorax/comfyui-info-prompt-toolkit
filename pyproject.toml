[project]
name = "info-prompt-toolkit"
version = "1.5.0"
description = "Protect prompts and model details with selective encryption while saving A1111/Civitai-compatible metadata. Built around reusable image_info data to simplify ComfyUI wiring and carry generation settings into the next workflow. Additional tools include same-name .txt caption saving, re-encoding-free referenced-image saving, XY Plot, Tiled Sampling for SDXL and Anima, SAM3, Detailer, PixAI Tagger, OppaiOracle Tagger, wildcards, and Dynamic Prompts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "timm>=1.0.17",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "cryptography>=41.0.0",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
Repository = "https://github.com/kinorax/comfyui-info-prompt-toolkit"
"Bug Tracker" = "https://github.com/kinorax/comfyui-info-prompt-toolkit/issues"
# Documentation = "https://github.com/kinorax/comfyui-info-prompt-toolkit"

[tool.comfy]
PublisherId = "kinorax"
DisplayName = "ComfyUI-Info-Prompt-Toolkit"
Icon = "https://raw.githubusercontent.com/kinorax/comfyui-info-prompt-toolkit/main/Icon.png"
Banner = "https://raw.githubusercontent.com/kinorax/comfyui-info-prompt-toolkit/main/Banner.png"
requires-comfyui = ">=0.17.0"
